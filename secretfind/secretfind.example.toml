# secretfind 掃描設定 —— 範本。複製一份再改：
#
#     cp secretfind.example.toml scan.toml
#     uv run secretfind.py scan --config scan.toml
#
# 這個檔只放「掃哪裡、略過哪裡」，**永遠不放 credential 的值**（值在 Keychain）。
# 所有鍵都是選填；不認識的鍵會直接報錯，避免打錯字（excludes）卻默默多掃。
# 指令列上給的路徑、--exclude、--service 會和這裡的取聯集；--max-size 以指令列為準。

# 要掃的檔案或目錄。相對路徑以「這個設定檔所在的目錄」為基準。
paths = [
    "~/Desktop/Happy-Job-Hunting",
]

# 排除規則（fnmatch，不是完整的 gitignore 語法）：
#   沒有 /          任何深度的檔名或目錄名      ".git"、"*.mp4"、"node_modules"
#   有 /            相對「掃描根目錄」的路徑     "data/raw"、"*/cache/*"
#   / 或 ~ 開頭     絕對路徑（含底下所有東西）   "~/Desktop/Happy-Job-Hunting/interviews"
# 命中的目錄整個不進去。
exclude = [
    "*.mp4",
    "*.m4a",
]

# 預設排除 .git、.venv、node_modules、__pycache__ 等。要連它們一起掃就設 false。
# default_excludes = true

# 比對哪些 Keychain service 的值。預設只有 secretfind。
# service = ["secretfind", "Happy-Job-Hunting"]

# 超過這個大小（MB）的檔案跳過。
# max_size = 50
